<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ôn tập Chủ đề 1 – Các phép đo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #e0f2fe, #f8fafc);
    color: #1e293b;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

/* ================= START ================= */

#startScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.start-box {
    width: 100%;
    max-width: 600px;
    background: white;
    padding: 35px;
    border-radius: 22px;
    box-shadow: 0 10px 35px rgba(0,0,0,.12);
    text-align: center;
}

.start-box h1 {
    color: #2563eb;
    margin-bottom: 10px;
}

.start-box h2 {
    font-size: 20px;
    margin-bottom: 25px;
}

.input-group {
    text-align: left;
    margin-bottom: 18px;
}

.input-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.input-group input,
.input-group select {
    width: 100%;
    padding: 13px;
    border: 2px solid #cbd5e1;
    border-radius: 10px;
    font-size: 16px;
}

.start-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.start-btn:hover {
    background: #1d4ed8;
}

/* ================= MAIN ================= */

#quizScreen {
    display: none;
}

.header {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.header h1 {
    text-align: center;
    color: #2563eb;
    margin: 0 0 10px;
}

.student-info {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    font-weight: bold;
}

.layout {
    display: grid;
    grid-template-columns: 1fr 250px;
    gap: 20px;
}

/* ================= QUESTION ================= */

.question-card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.question-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 18px;
}

.option {
    padding: 13px 15px;
    border: 2px solid #cbd5e1;
    border-radius: 10px;
    margin: 10px 0;
    cursor: pointer;
    transition: .2s;
}

.option:hover {
    background: #eff6ff;
}

.option.selected {
    border-color: #2563eb;
    background: #dbeafe;
}

.option.correct {
    background: #dcfce7;
    border-color: #16a34a;
    color: #166534;
}

.option.wrong {
    background: #fee2e2;
    border-color: #dc2626;
    color: #991b1b;
}

.feedback {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    font-weight: bold;
    display: none;
}

.feedback.correct-feedback {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.feedback.wrong-feedback {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.answer-box {
    display: none;
    margin-top: 12px;
    padding: 12px;
    background: #f1f5f9;
    border-radius: 10px;
}

/* ================= SHORT ANSWER ================= */

.short-input {
    width: 100%;
    padding: 13px;
    border: 2px solid #cbd5e1;
    border-radius: 10px;
    font-size: 16px;
    margin-top: 10px;
}

.check-btn,
.answer-btn {
    margin-top: 10px;
    padding: 10px 16px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
}

.check-btn {
    background: #2563eb;
    color: white;
}

.answer-btn {
    background: #f59e0b;
    color: white;
}

/* ================= SIDEBAR ================= */

.sidebar {
    background: white;
    border-radius: 18px;
    padding: 18px;
    height: fit-content;
    position: sticky;
    top: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.sidebar h3 {
    margin-top: 0;
    text-align: center;
}

.question-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.q-number {
    border: none;
    border-radius: 8px;
    padding: 10px 5px;
    cursor: pointer;
    background: #e2e8f0;
    font-weight: bold;
}

.q-number.answered {
    background: #bfdbfe;
}

.q-number.correct {
    background: #86efac;
}

.q-number.wrong {
    background: #fca5a5;
}

/* ================= BUTTON ================= */

.submit-box {
    background: white;
    padding: 25px;
    border-radius: 18px;
    text-align: center;
    margin-top: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.submit-btn {
    padding: 15px 35px;
    border: none;
    border-radius: 12px;
    background: #16a34a;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn:hover {
    background: #15803d;
}

.score-box {
    margin-top: 15px;
    font-size: 22px;
    font-weight: bold;
    color: #2563eb;
}

.status {
    margin-top: 15px;
    font-weight: bold;
}

/* ================= RESPONSIVE ================= */

@media(max-width: 800px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        position: static;
    }
}
</style>
</head>

/* =====================================================
   ÂM THANH
===================================================== */

function playSound(correct) {

    try {

        const AudioContext =
            window.AudioContext || window.webkitAudioContext;

        const ctx = new AudioContext();

        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        if(correct) {
            oscillator.frequency.value = 800;
        } else {
            oscillator.frequency.value = 220;
        }

        oscillator.type = "sine";

        gain.gain.setValueAtTime(0.15, ctx.currentTime);

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + 0.25
        );

        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.25);

    } catch(e) {}

}


/* =====================================================
   BẮT ĐẦU
===================================================== */

function startQuiz() {

    studentName =
        document.getElementById("studentName").value.trim();

    studentClass =
        document.getElementById("studentClass").value;

    if(!studentName) {
        alert("Vui lòng nhập họ và tên.");
        return;
    }

    if(!studentClass) {
        alert("Vui lòng chọn lớp.");
        return;
    }

    document.getElementById("displayName").textContent =
        studentName;

    document.getElementById("displayClass").textContent =
        studentClass;

    document.getElementById("startScreen").style.display = "none";

    document.getElementById("quizScreen").style.display = "block";

    renderQuestions();

    window.scrollTo(0,0);
}


/* =====================================================
   HIỂN THỊ CÂU HỎI
===================================================== */

function renderQuestions() {

    const container =
        document.getElementById("questionsContainer");

    container.innerHTML = "";

    questions.forEach((q,index) => {

        const card =
            document.createElement("div");

        card.className = "question-card";

        card.id = "question-" + index;

        let html = `
            <div class="question-title">
                Câu ${index+1}. ${q.question}
            </div>
        `;


        /* ===== MCQ ===== */

        if(q.type === "mcq") {

            q.options.forEach((option,i) => {

                html += `
                    <div
                        class="option"
                        id="option-${index}-${i}"
                        onclick="selectMCQ(${index},${i})"
                    >
                        <b>${String.fromCharCode(65+i)}.</b>
                        ${option}
                    </div>
                `;

            });

        }


        /* ===== TRUE FALSE ===== */

        if(q.type === "tf") {

            html += `
                <div
                    class="option"
                    id="option-${index}-true"
                    onclick="selectTF(${index},true)"
                >
                    <b>A.</b> Đúng
                </div>

                <div
                    class="option"
                    id="option-${index}-false"
                    onclick="selectTF(${index},false)"
                >
                    <b>B.</b> Sai
                </div>
            `;

        }


        /* ===== SHORT ANSWER ===== */

        if(q.type === "short") {

            html += `
                <input
                    class="short-input"
                    id="short-${index}"
                    placeholder="Nhập câu trả lời..."
                    oninput="updateShort(${index})"
                >

                <br>

                <button
                    class="check-btn"
                    onclick="checkShort(${index})"
                >
                    ✓ KIỂM TRA
                </button>
            `;

        }


        html += `
            <div
                class="feedback"
                id="feedback-${index}"
            ></div>

            <div
                class="answer-box"
                id="answer-${index}"
            ></div>

            <button
                class="answer-btn"
                onclick="showAnswer(${index})"
            >
                💡 HIỆN ĐÁP ÁN
            </button>
        `;

        card.innerHTML = html;

        container.appendChild(card);

    });


    renderGrid();

}


/* =====================================================
   MCQ
===================================================== */

function selectMCQ(index,choice) {

    userAnswers[index] = choice;

    checked[index] = true;

    const q = questions[index];

    q.options.forEach((_,i) => {

        const el =
            document.getElementById(`option-${index}-${i}`);

        el.classList.remove(
            "selected",
            "correct",
            "wrong"
        );

    });


    const selected =
        document.getElementById(
            `option-${index}-${choice}`
        );

    if(choice === q.answer) {

        selected.classList.add("correct");

        showFeedback(
            index,
            true,
            "✓ Chính xác!"
        );

        playSound(true);

    } else {

        selected.classList.add("wrong");

        const correctOption =
            document.getElementById(
                `option-${index}-${q.answer}`
            );

        correctOption.classList.add("correct");

        showFeedback(
            index,
            false,
            "✗ Chưa đúng! Em có thể chọn lại."
        );

        playSound(false);

    }

    updateScore();

    renderGrid();
}


/* =====================================================
   TRUE / FALSE
===================================================== */

function selectTF(index,value) {

    userAnswers[index] = value;

    checked[index] = true;

    const q = questions[index];

    const trueEl =
        document.getElementById(`option-${index}-true`);

    const falseEl =
        document.getElementById(`option-${index}-false`);

    trueEl.classList.remove(
        "selected",
        "correct",
        "wrong"
    );

    falseEl.classList.remove(
        "selected",
        "correct",
        "wrong"
    );


    const selected =
        value ? trueEl : falseEl;

    if(value === q.answer) {

        selected.classList.add("correct");

        showFeedback(
            index,
            true,
            "✓ Chính xác!"
        );

        playSound(true);

    } else {

        selected.classList.add("wrong");

        const correctEl =
            q.answer ? trueEl : falseEl;

        correctEl.classList.add("correct");

        showFeedback(
            index,
            false,
            "✗ Chưa đúng! Em có thể chọn lại."
        );

        playSound(false);

    }

    updateScore();

    renderGrid();
}


/* =====================================================
   CÂU TRẢ LỜI NGẮN
===================================================== */

function updateShort(index) {

    const value =
        document.getElementById(`short-${index}`).value.trim();

    userAnswers[index] = value;

}


/* =====================================================
   KIỂM TRA CÂU NGẮN
===================================================== */

function checkShort(index) {

    const q = questions[index];

    const input =
        document.getElementById(`short-${index}`);

    const value =
        input.value.trim().toLowerCase();

    if(!value) {

        alert("Em hãy nhập câu trả lời.");

        return;

    }

    userAnswers[index] = value;

    checked[index] = true;

    const correct =
        q.answers.some(
            a => normalize(a) === normalize(value)
        );

    if(correct) {

        showFeedback(
            index,
            true,
            "✓ Chính xác!"
        );

        playSound(true);

    } else {

        showFeedback(
            index,
            false,
            "✗ Chưa đúng! Em có thể sửa và kiểm tra lại."
        );

        playSound(false);

    }

    updateScore();

    renderGrid();
}


/* =====================================================
   CHUẨN HÓA CÂU TRẢ LỜI
===================================================== */

function normalize(text) {

    return String(text)
        .toLowerCase()
        .replace(/\s+/g,"")
        .replace(/,/g,".")
        .replace(/°c/g,"")
        .replace(/độ/g,"")
        .replace(/phút/g,"")
        .replace(/giây/g,"")
        .replace(/kg/g,"kg")
        .trim();

}


/* =====================================================
   FEEDBACK
===================================================== */

function showFeedback(index,correct,message) {

    const box =
        document.getElementById(`feedback-${index}`);

    box.className =
        "feedback " +
        (correct
            ? "correct-feedback"
            : "wrong-feedback");

    box.textContent = message;

}


/* =====================================================
   HIỆN ĐÁP ÁN
===================================================== */

function showAnswer(index) {

    const q = questions[index];

    const box =
        document.getElementById(`answer-${index}`);

    let answer = "";

    if(q.type === "mcq") {

        answer =
            "Đáp án: " +
            String.fromCharCode(65 + q.answer) +
            ". " +
            q.options[q.answer];

    }

    if(q.type === "tf") {

        answer =
            "Đáp án: " +
            (q.answer ? "Đúng" : "Sai");

    }

    if(q.type === "short") {

        answer =
            "Đáp án: " + q.displayAnswer;

    }

    box.innerHTML =
        `<b>${answer}</b><br><br>${q.explanation}`;

    box.style.display = "block";

}


/* =====================================================
   TÍNH ĐIỂM
   Mỗi câu 0,5 điểm
===================================================== */

function isCorrect(index) {

    const q = questions[index];

    const answer = userAnswers[index];

    if(answer === null || answer === "") {
        return false;
    }

    if(q.type === "mcq") {
        return answer === q.answer;
    }

    if(q.type === "tf") {
        return answer === q.answer;
    }

    if(q.type === "short") {

        return q.answers.some(
            a => normalize(a) === normalize(answer)
        );

    }

    return false;
}


function calculateScore() {

    let correct = 0;

    questions.forEach((_,index) => {

        if(isCorrect(index)) {
            correct++;
        }

    });

    return correct * 0.5;

}


function updateScore() {

    const score =
        calculateScore();

    document.getElementById("currentScore")
        .textContent = score.toFixed(1);

    document.getElementById("finalScore")
        .textContent = score.toFixed(1);

}


/* =====================================================
   BẢNG CÂU HỎI BÊN PHẢI
===================================================== */

function renderGrid() {

    const grid =
        document.getElementById("questionGrid");

    grid.innerHTML = "";

    questions.forEach((q,index) => {

        const btn =
            document.createElement("button");

        btn.className = "q-number";

        btn.textContent = index + 1;

        if(userAnswers[index] !== null &&
           userAnswers[index] !== "") {

            btn.classList.add("answered");

            if(isCorrect(index)) {
                btn.classList.add("correct");
            } else if(checked[index]) {
                btn.classList.add("wrong");
            }

        }

        btn.onclick = function() {

            document
                .getElementById(`question-${index}`)
                .scrollIntoView({
                    behavior:"smooth",
                    block:"start"
                });

        };

        grid.appendChild(btn);

    });

}


/* =====================================================
   NỘP KẾT QUẢ GOOGLE SHEETS
===================================================== */

async function submitResult() {

    const unanswered =
        questions.filter(
            (_,index) =>
                userAnswers[index] === null ||
                userAnswers[index] === ""
        ).length;


    if(unanswered > 0) {

        const confirmSubmit =
            confirm(
                `Em còn ${unanswered} câu chưa trả lời.\n\n` +
                `Em có chắc muốn nộp bài không?`
            );

        if(!confirmSubmit) {
            return;
        }

    } else {

        const confirmSubmit =
            confirm(
                "Em có chắc muốn nộp bài không?"
            );

        if(!confirmSubmit) {
            return;
        }

    }


    const score =
        Number(calculateScore().toFixed(1));


    /* 
       DỮ LIỆU GỬI SANG APPS SCRIPT

       Apps Script sẽ nhận:
       hoTen
       lop
       diem
       baiKiemTra
    */

    const data = {

        hoTen: studentName,

        lop: studentClass,

        diem: score,

        baiKiemTra: TEST_NAME

    };


    const status =
        document.getElementById("submitStatus");

    status.textContent =
        "⏳ Đang gửi kết quả...";

    status.style.color = "#2563eb";


    try {

        await fetch(
            GOOGLE_SCRIPT_URL,
            {
                method: "POST",

                mode: "no-cors",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body: JSON.stringify(data)
            }
        );


        /*
          Vì no-cors không cho HTML đọc phản hồi
          từ Google Apps Script, không thể đọc trực tiếp
          success:true/false từ doPost().
        */

        status.textContent =
            "✅ ĐÃ GỬI KẾT QUẢ!";

        status.style.color = "#16a34a";

        document.querySelector(".submit-btn")
            .disabled = true;

        document.querySelector(".submit-btn")
            .style.opacity = "0.6";

    } catch(error) {

        console.error(error);

        status.textContent =
            "❌ Không gửi được kết quả. Hãy kiểm tra lại kết nối.";

        status.style.color = "#dc2626";

    }

}


/* =====================================================
   KHỞI TẠO
===================================================== */

updateScore();

</script>
